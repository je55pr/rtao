name: Deploy GitHub Pages

# The repository has one published build: the current dev branch at the root
# Pages URL. VITE_RTA_CHANNEL stays "dev" so browsers that previously used the
# old /dev/ deployment keep the same OPFS install/cache after the URL moves.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: rtao/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        working-directory: rtao
        run: npm ci
      - name: Build game
        working-directory: rtao
        env:
          VITE_RTA_CHANNEL: dev
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: rtao/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
