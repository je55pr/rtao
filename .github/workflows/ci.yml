name: CI

on:
  push:
    branches: [main, dev]
  # Every pull request, whatever it targets: normal work integrates into dev,
  # and a stacked PR is based on another task branch rather than on dev.
  pull_request:

concurrency:
  group: rtao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: rtao/package-lock.json
      - name: Install dependencies
        working-directory: rtao
        run: npm ci
      - name: Run browser gate
        working-directory: rtao
        run: npm run check
