workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:22.12.0-bookworm-slim
  interruptible: true

stages:
  - verify

browser-gate:
  stage: verify
  cache:
    key:
      files:
        - rtao/package-lock.json
    paths:
      - rtao/.npm/
  before_script:
    - cd rtao
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check
  rules:
    - when: on_success
